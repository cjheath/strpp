# The documentation site, built with mdbook:
#
#   make doc		build, and commit the result to the gh-pages branch
#
# The Markdown sources live in doc/ on this branch; the built site replaces
# the contents of gh-pages, whose root Github Pages serves.
[book]
title = "strpp"
description = "Reference-counted, copy-on-write value types with slices"
src = "doc"
language = "en"

[build]
build-dir = "build/doc"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/cjheath/strpp"
